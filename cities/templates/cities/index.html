<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroPolis </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --ocean:#295773;--ocean2:#295D7D;--sky:#C8D7E4;--lav:#F3EBF3;
  --green:#7AAC6C;--bg:#F3EBF3;--surface:#ffffff;--surface2:#EEF4F8;
  --bar:#295773;--bar2:#1e4060;--txt:#1a2e3d;
  --txt2:rgba(26,46,61,.60);--txt3:rgba(26,46,61,.38);
  --bdr:rgba(41,87,115,.14);--bdr2:rgba(41,87,115,.26);
  --hi:#7AAC6C;--md:#4D9AC0;--lo:#C0616E;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--txt);overflow:hidden;height:100vh;width:100vw}
#map{position:fixed;inset:0;z-index:1}
.leaflet-tile-pane{filter:saturate(.68) brightness(1.03) hue-rotate(195deg) sepia(.08)}
.leaflet-control-zoom,.leaflet-control-attribution{display:none}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 90% 90% at 50% 50%,transparent 42%,rgba(243,235,243,.26) 100%)}

/* TOP BAR */
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;height:54px;
  display:flex;align-items:center;padding:0 20px;gap:14px;
  background:var(--bar);border-bottom:1px solid rgba(200,215,228,.15);
  box-shadow:0 2px 24px rgba(41,87,115,.35)}
#logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:400;
  letter-spacing:.03em;color:#deeaf3;display:flex;align-items:center;gap:2px}
#logo span{color:#a8d4a0;font-style:italic}
.tagline{font-family:'DM Mono',monospace;font-size:7.5px;letter-spacing:.13em;
  text-transform:uppercase;color:rgba(200,215,228,.38);
  border-left:1px solid rgba(200,215,228,.18);padding-left:12px;line-height:1.9}
.spacer{flex:1}
#cmp-toggle-btn{display:flex;align-items:center;gap:6px;
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(200,215,228,.65);padding:5px 13px;
  border:1px solid rgba(200,215,228,.22);border-radius:20px;
  background:rgba(200,215,228,.09);cursor:pointer;transition:all .2s;margin-right:6px}
#cmp-toggle-btn:hover{background:rgba(200,215,228,.18);color:#deeaf3}
#cmp-toggle-btn.active{background:var(--green);color:#fff;border-color:var(--green);
  box-shadow:0 2px 12px rgba(122,172,108,.45)}
.livebadge{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;
  font-size:9px;letter-spacing:.1em;color:#a8d4a0;padding:5px 12px;
  border:1px solid rgba(168,212,160,.28);border-radius:20px;background:rgba(168,212,160,.1)}
.ldot{width:5px;height:5px;border-radius:50%;background:#a8d4a0;animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* SEARCH */
#searchbar{position:fixed;top:9px;left:50%;transform:translateX(-50%);z-index:21;width:268px}
#sinput{width:100%;padding:8px 34px 8px 13px;
  background:rgba(255,255,255,.97);border:1px solid var(--bdr2);border-radius:22px;
  color:var(--txt);font-family:'DM Mono',monospace;font-size:11px;outline:none;
  box-shadow:0 2px 10px rgba(41,87,115,.1);transition:border-color .2s,box-shadow .2s}
#sinput::placeholder{color:var(--txt3)}
#sinput:focus{border-color:var(--ocean2);box-shadow:0 0 0 3px rgba(41,93,125,.12)}
.sicon{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--ocean2);font-size:13px;pointer-events:none}
#sresults{position:absolute;top:calc(100% + 5px);left:0;right:0;
  background:var(--surface);border:1px solid var(--bdr2);border-radius:13px;
  overflow:hidden;display:none;box-shadow:0 10px 34px rgba(41,87,115,.16)}
.sri{padding:9px 13px;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;
  color:var(--txt2);border-bottom:1px solid var(--bdr);
  display:flex;justify-content:space-between;align-items:center;transition:background .12s}
.sri:last-child{border-bottom:none}
.sri:hover{background:rgba(41,87,115,.05)}
.sri-city{font-weight:500;color:var(--txt)}.sri-ctry{font-size:9px;color:var(--txt3);margin-top:1px}.sri-sc{font-weight:600;font-size:13px}

/* ZOOM */
#zoom{position:fixed;left:15px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:4px}
.zbtn{width:30px;height:30px;background:rgba(255,255,255,.94);border:1px solid var(--bdr2);
  border-radius:8px;color:var(--ocean2);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(41,87,115,.1);transition:all .15s;line-height:1}
.zbtn:hover{background:var(--ocean);color:#fff;border-color:var(--ocean)}

/* SIDEBAR */
#sidebar{position:fixed;right:14px;top:64px;bottom:62px;z-index:20;
  width:192px;display:flex;flex-direction:column;gap:7px;overflow-y:auto}
#sidebar::-webkit-scrollbar{width:2px}
#sidebar::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:1px}
.panel{background:rgba(255,255,255,.88);border:1px solid var(--bdr);border-radius:13px;
  backdrop-filter:blur(12px);overflow:hidden;flex-shrink:0;
  box-shadow:0 3px 16px rgba(41,87,115,.1)}
.phd{padding:9px 12px;border-bottom:1px solid var(--bdr);
  font-family:'DM Mono',monospace;font-size:7.5px;font-weight:500;
  letter-spacing:.15em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.phd.top{color:var(--green)}.phd.low{color:var(--lo)}
.ri{padding:8px 11px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .12s}
.ri:last-child{border-bottom:none}
.ri:hover{background:rgba(41,87,115,.04)}
.ri-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.ri-num{font-family:'DM Mono',monospace;font-size:7px;color:var(--txt3);margin-right:4px;min-width:11px}
.ri-city{font-size:10.5px;font-weight:500;color:var(--txt);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-score{font-family:'DM Mono',monospace;font-size:11px;font-weight:600;margin-left:4px}
.ri-ctry{font-size:9px;color:var(--txt3);font-family:'DM Mono',monospace;padding-left:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-bar{height:2px;background:rgba(41,87,115,.1);border-radius:1px;margin-top:4px;overflow:hidden}
.ri-fill{height:100%;border-radius:1px;opacity:.75}

/* STATS */
#stats{position:fixed;left:15px;bottom:60px;z-index:20;display:flex;gap:5px}
.sc{background:rgba(255,255,255,.88);border:1px solid var(--bdr);border-radius:11px;
  padding:8px 13px;min-width:78px;box-shadow:0 3px 12px rgba(41,87,115,.1)}
.sclbl{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);margin-bottom:3px}
.scval{font-family:'DM Mono',monospace;font-size:17px;font-weight:600}
.scsub{font-family:'DM Mono',monospace;font-size:7px;color:var(--txt3);margin-top:2px}

/* TICKER */
#ticker{position:fixed;bottom:0;left:0;right:0;z-index:20;height:48px;
  background:var(--bar2);border-top:1px solid rgba(200,215,228,.14);
  display:flex;align-items:center;overflow:hidden;
  box-shadow:0 -2px 24px rgba(41,87,115,.3)}
.tlbl{flex-shrink:0;padding:0 15px;font-family:'DM Mono',monospace;font-size:7.5px;
  font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(200,215,228,.7);border-right:1px solid rgba(200,215,228,.15);
  height:100%;display:flex;align-items:center;white-space:nowrap}
#ticker-stage{flex:1;display:flex;align-items:center;justify-content:center;
  position:relative;height:100%;overflow:hidden}
.tick-card{position:absolute;display:flex;align-items:center;gap:24px;
  opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease;pointer-events:none}
.tick-card.active{opacity:1;transform:translateY(0)}
.tick-card.leaving{opacity:0;transform:translateY(-8px)}
.tick-item{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:10px}
.tick-city{color:rgba(200,215,228,.48)}
.tick-score{font-weight:600;font-size:11px}
.tick-dot{width:5px;height:5px;border-radius:50%}

/* MARKERS */
.cmark{cursor:pointer;position:relative;width:0;height:0}
.cring{position:absolute;border-radius:50%;border:1.5px solid currentColor;
  opacity:0;animation:rexp 3s ease-out infinite;pointer-events:none}
@keyframes rexp{0%{transform:scale(.45);opacity:.55}100%{transform:scale(2);opacity:0}}
.cball{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'DM Mono',monospace;font-weight:700;color:#fff;z-index:2;
  transition:transform .18s ease;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.cmark:hover .cball{transform:scale(1.2)}
.clabel{position:absolute;white-space:nowrap;pointer-events:none}
.ccity{font-family:'DM Sans',sans-serif;font-size:9px;font-weight:600;color:#1a2e3d;
  text-shadow:0 1px 4px rgba(243,235,243,1),0 0 8px rgba(243,235,243,.9)}
.cmark.csel .cball{outline:3px solid #fff;outline-offset:2px;transform:scale(1.28);
  box-shadow:0 0 0 5px rgba(41,87,115,.3),0 4px 14px rgba(0,0,0,.22)}

/* TOOLTIP */
.ctt{background:#fff!important;border:1px solid var(--bdr2)!important;border-radius:12px!important;
  padding:13px 15px!important;color:var(--txt)!important;font-family:'DM Sans',sans-serif!important;
  box-shadow:0 8px 28px rgba(41,87,115,.16)!important;pointer-events:none!important;white-space:nowrap!important;min-width:145px!important}
.ctt::before{display:none!important}
.ttcity{font-size:12px;font-weight:600;color:var(--txt);margin-bottom:2px}
.ttctry{font-family:'DM Mono',monospace;font-size:9px;color:var(--txt3);margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--bdr)}
.ttrow{display:flex;align-items:baseline;gap:6px}
.ttlbl{font-family:'DM Mono',monospace;font-size:8px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase}
.ttscore{font-family:'DM Mono',monospace;font-size:26px;font-weight:700}
.tt-hint{font-family:'DM Mono',monospace;font-size:8px;color:var(--ocean2);margin-top:8px;
  padding-top:8px;border-top:1px solid var(--bdr);letter-spacing:.05em;display:none}

/* COMPARE BANNER */
#cmp-banner{position:fixed;top:64px;left:50%;transform:translateX(-50%);
  z-index:25;background:rgba(28,56,80,.94);
  border:1px solid rgba(200,215,228,.22);border-radius:26px;
  padding:8px 8px 8px 16px;display:none;align-items:center;gap:9px;
  backdrop-filter:blur(16px);box-shadow:0 6px 28px rgba(41,87,115,.38);
  animation:sld .25s cubic-bezier(.175,.885,.32,1.2)}
@keyframes sld{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#cmp-banner.show{display:flex}
.cslots{display:flex;align-items:center;gap:6px}
.cslot{width:100px;height:33px;background:rgba(200,215,228,.07);
  border:1.5px dashed rgba(200,215,228,.25);border-radius:10px;
  display:flex;align-items:center;justify-content:center;gap:3px;
  font-family:'DM Mono',monospace;font-size:9px;color:rgba(200,215,228,.35);
  transition:all .2s;position:relative;overflow:hidden}
.cslot.filled{border-style:solid;background:rgba(200,215,228,.1)}
.sname{font-weight:600;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px}
.ssc{font-size:11px;font-weight:700;margin-left:1px}
.sx{position:absolute;top:3px;right:4px;font-size:8px;cursor:pointer;
  color:rgba(200,215,228,.35);line-height:1;transition:color .15s}
.sx:hover{color:#f28585}
.cvs{font-family:'Playfair Display',serif;font-style:italic;font-size:12px;color:rgba(200,215,228,.3)}
.cgo{padding:6px 14px;background:var(--green);color:#fff;border:none;border-radius:10px;
  cursor:pointer;font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;transition:all .18s;opacity:.35;pointer-events:none;
  box-shadow:0 2px 8px rgba(122,172,108,.3)}
.cgo.ready{opacity:1;pointer-events:all}
.cgo.ready:hover{background:#68994f}
.cban-close{width:28px;height:28px;background:rgba(200,215,228,.08);
  border:1px solid rgba(200,215,228,.2);border-radius:10px;
  color:rgba(200,215,228,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:11px;transition:all .15s;flex-shrink:0;margin-left:2px}
.cban-close:hover{background:rgba(192,97,110,.2);color:#f28585;border-color:rgba(192,97,110,.35)}

/* ── SINGLE CITY MODAL ───────────────────────────────────────────── */
#mov{position:fixed;inset:0;z-index:100;background:rgba(10,22,33,.8);
  backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:20px}
#mov.open{display:flex;animation:fo .22s ease}
@keyframes fo{from{opacity:0}to{opacity:1}}
#modal{background:#162a3b;border:1px solid rgba(200,215,228,.18);border-radius:22px;
  width:600px;max-width:100%;max-height:90vh;overflow-y:auto;
  box-shadow:0 36px 90px rgba(6,14,22,.7),0 4px 24px rgba(6,14,22,.4);
  animation:mi .3s cubic-bezier(.175,.885,.32,1.2);position:relative;
  scrollbar-width:thin;scrollbar-color:rgba(200,215,228,.2) transparent}
#modal::-webkit-scrollbar{width:3px}
#modal::-webkit-scrollbar-thumb{background:rgba(200,215,228,.2);border-radius:2px}
@keyframes mi{from{opacity:0;transform:scale(.95) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}

.mstripe{height:4px;width:100%;border-radius:22px 22px 0 0}
.mhead{padding:26px 28px 22px;border-bottom:1px solid rgba(200,215,228,.1);
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.mhl{flex:1;min-width:0}
.mcity{font-family:'Playfair Display',serif;font-size:28px;font-weight:400;
  color:#deeaf3;line-height:1.1;margin-bottom:8px}
.mctry{font-family:'DM Mono',monospace;font-size:12px;color:rgba(200,215,228,.5);
  display:flex;align-items:center;gap:6px;letter-spacing:.04em}
.mhr{text-align:right;flex-shrink:0}
.mslbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.22em;
  text-transform:uppercase;color:rgba(200,215,228,.36);margin-bottom:6px}
.msval{font-family:'DM Mono',monospace;font-size:52px;font-weight:700;line-height:1}
.mrank{font-family:'DM Mono',monospace;font-size:10px;color:rgba(200,215,228,.34);
  margin-top:5px;letter-spacing:.04em}
#mclose{position:absolute;top:16px;right:16px;width:32px;height:32px;z-index:10;
  background:rgba(200,215,228,.08);border:1px solid rgba(200,215,228,.15);
  border-radius:10px;color:rgba(200,215,228,.5);cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;transition:all .15s}
#mclose:hover{background:rgba(192,97,110,.2);color:#f28585;border-color:rgba(192,97,110,.35)}

.mbody{padding:22px 28px 24px}
.mzone-row{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.mzone-badge{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;padding:5px 14px;border-radius:20px;font-weight:500}
.mzone-badge.pos{background:rgba(122,172,108,.22);color:#a8d4a0;border:1px solid rgba(122,172,108,.3)}
.mzone-badge.neu{background:rgba(77,154,192,.2);color:#89c4de;border:1px solid rgba(77,154,192,.3)}
.mzone-badge.neg{background:rgba(192,97,110,.2);color:#e8909a;border:1px solid rgba(192,97,110,.3)}
.mzone-rank{font-family:'DM Mono',monospace;font-size:11px;font-weight:600;
  padding:4px 12px;border-radius:20px;background:rgba(200,215,228,.08);color:rgba(200,215,228,.5)}


/* METRICS BAR CHART */
.mmetrics-title{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(200,215,228,.36);margin-bottom:12px}
.mmetrics-chart{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.mmc-row{display:grid;grid-template-columns:130px 1fr 42px;align-items:center;gap:10px}
.mmc-lbl{font-family:'DM Mono',monospace;font-size:9px;color:rgba(200,215,228,.5);text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmc-track{height:8px;background:rgba(200,215,228,.08);border-radius:4px;overflow:hidden;position:relative}
.mmc-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.25,.46,.45,.94)}
.mmc-fill-glow{position:absolute;top:0;left:0;height:100%;border-radius:4px;
  opacity:.3;filter:blur(4px)}
.mmc-val{font-family:'DM Mono',monospace;font-size:10px;font-weight:700;text-align:right}

/* METRIC CARDS GRID (5 cards, 5th spans full) */
.mmetrics-cards{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.mmc-card{
  background:rgba(200,215,228,.06);border:1px solid rgba(200,215,228,.1);
  border-radius:12px;padding:13px 14px}
.mmc-card:last-child:nth-child(odd){grid-column:1/-1}
.mmc-card-lbl{
  font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(200,215,228,.38);margin-bottom:9px}
.mmc-card-bar{
  height:3px;background:rgba(200,215,228,.1);border-radius:2px;overflow:hidden;margin-bottom:8px}
.mmc-card-fill{height:100%;border-radius:2px;opacity:.9}
.mmc-card-vals{display:flex;justify-content:space-between;align-items:baseline}
.mmc-card-num{
  font-family:'DM Mono',monospace;font-size:18px;font-weight:700;line-height:1}
.mmc-card-unit{
  font-family:'DM Mono',monospace;font-size:9px;color:rgba(200,215,228,.35)}

/* RADAR */
.mradar-wrap{display:flex;gap:16px;align-items:center;margin-bottom:18px;
  background:rgba(200,215,228,.04);border:1px solid rgba(200,215,228,.09);
  border-radius:13px;padding:16px}
.mradar-legend{display:flex;flex-direction:column;gap:8px;min-width:130px}
.mrl-row{display:flex;align-items:center;gap:8px}
.mrl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mrl-info{font-family:'DM Mono',monospace;font-size:9px;color:rgba(200,215,228,.5)}
.mrl-val{font-weight:700;color:rgba(200,215,228,.85)}

/* SCATTER */
.mscatter-wrap{background:rgba(200,215,228,.04);border:1px solid rgba(200,215,228,.09);
  border-radius:13px;padding:16px;margin-bottom:0}
.mscatter-lbl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(200,215,228,.36);margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center}

.mfoot{padding:14px 28px 20px;border-top:1px solid rgba(200,215,228,.1);
  display:flex;justify-content:space-between;align-items:center}
.mfts{font-family:'DM Mono',monospace;font-size:9px;color:rgba(200,215,228,.3);letter-spacing:.04em}
.madd-cmp{display:flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;
  font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#a8d4a0;
  padding:7px 14px;border:1px solid rgba(122,172,108,.32);border-radius:10px;
  background:rgba(122,172,108,.1);cursor:pointer;transition:all .15s}
.madd-cmp:hover{background:var(--green);color:#fff;border-color:var(--green)}
.madd-cmp.added{background:var(--green);color:#fff;pointer-events:none}

/* COMPARE MODAL */
#cmpov{position:fixed;inset:0;z-index:110;background:rgba(6,14,22,.8);
  backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center}
#cmpov.open{display:flex;animation:fo .2s ease}
#cmpmodal{background:#152434;border:1px solid rgba(200,215,228,.16);border-radius:20px;
  width:780px;max-width:96vw;max-height:90vh;overflow-y:auto;
  box-shadow:0 32px 90px rgba(0,0,0,.65),0 4px 22px rgba(0,0,0,.35);
  animation:mi .3s cubic-bezier(.175,.885,.32,1.2);position:relative;color:#deeaf3}
#cmpmodal::-webkit-scrollbar{width:3px}
#cmpmodal::-webkit-scrollbar-thumb{background:rgba(200,215,228,.18);border-radius:1.5px}

.cmphd{padding:20px 24px 16px;border-bottom:1px solid rgba(200,215,228,.09);
  display:flex;align-items:center;gap:12px}
.cmphd-cities{display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap}
.cmphd-city{font-family:'Playfair Display',serif;font-size:17px;font-weight:400;line-height:1}
.cmphd-vs{font-family:'DM Mono',monospace;font-size:10px;color:rgba(200,215,228,.28);
  padding:2px 7px;border:1px solid rgba(200,215,228,.12);border-radius:6px}
#cmclose{width:28px;height:28px;flex-shrink:0;
  background:rgba(200,215,228,.06);border:1px solid rgba(200,215,228,.14);border-radius:8px;
  color:rgba(200,215,228,.42);cursor:pointer;font-size:11px;
  display:flex;align-items:center;justify-content:center;transition:all .15s}
#cmclose:hover{background:rgba(192,97,110,.16);color:#f28585;border-color:rgba(192,97,110,.28)}

.cmp-hero{display:flex;padding:20px 24px;gap:0;align-items:stretch;
  border-bottom:1px solid rgba(200,215,228,.09)}
.cmp-hcity{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:14px 10px;border-radius:13px;position:relative}
.cmp-hcity.winner{background:rgba(122,172,108,.09)}
.cmp-hcity.winner::after{content:'WINNER';position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  font-family:'DM Mono',monospace;font-size:6px;letter-spacing:.2em;
  background:var(--green);color:#fff;padding:2px 8px;border-radius:0 0 6px 6px}
.cmp-hname{font-family:'Playfair Display',serif;font-size:15px;color:#deeaf3;text-align:center}
.cmp-hcountry{font-family:'DM Mono',monospace;font-size:8px;color:rgba(200,215,228,.32);margin-top:1px}
.cmp-hscore{font-family:'DM Mono',monospace;font-size:42px;font-weight:700;line-height:1}
.cmp-htag{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.12em;
  padding:3px 9px;border-radius:10px;text-transform:uppercase;margin-top:3px}
.cmp-htag.pos{background:rgba(122,172,108,.2);color:#a8d4a0}
.cmp-htag.neu{background:rgba(77,154,192,.18);color:#89c4de}
.cmp-htag.neg{background:rgba(192,97,110,.16);color:#e8909a}
.cmp-hrank{font-family:'DM Mono',monospace;font-size:8px;color:rgba(200,215,228,.28);margin-top:4px}
.cmp-hdiv{width:1px;background:rgba(200,215,228,.09);margin:10px 0}

.csec{padding:16px 24px;border-bottom:1px solid rgba(200,215,228,.08)}
.csec:last-child{border-bottom:none;padding-bottom:22px}
.csec-lbl{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(200,215,228,.3);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.csec-lbl::after{content:'';flex:1;height:1px;background:rgba(200,215,228,.08)}

/* compare grouped bar */
.cmp-bargroup{display:flex;flex-direction:column;gap:10px}
.cmp-bgrow{display:flex;flex-direction:column;gap:4px}
.cmp-bgrow-lbl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.08em;
  text-transform:uppercase;color:rgba(200,215,228,.32);margin-bottom:2px}
.cmp-bgbars{display:flex;align-items:center;gap:6px}
.cmp-bgbar{height:14px;border-radius:3px;opacity:.88;min-width:2px;transition:width .5s ease;position:relative;flex-shrink:0}
.cmp-bgval{font-family:'DM Mono',monospace;font-size:10px;font-weight:700;flex-shrink:0}
.cmp-bgspacer{flex:1}

.radar-wrap{display:flex;gap:20px;align-items:center}
.radar-legend{display:flex;flex-direction:column;gap:10px}
.rl-item{display:flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:9px}
.rl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.rl-city{font-weight:600}
.rl-country{font-size:7px;color:rgba(200,215,228,.3);margin-top:1px}

.cmp-wrow{display:flex;gap:8px}
.cmp-wbox{flex:1;background:rgba(200,215,228,.04);border:1px solid rgba(200,215,228,.09);
  border-radius:11px;padding:14px;text-align:center}
.cmp-wnum{font-family:'DM Mono',monospace;font-size:26px;font-weight:700}
.cmp-wlbl{font-family:'DM Mono',monospace;font-size:7px;color:rgba(200,215,228,.28);
  letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.cmp-wcity{font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:600;
  color:rgba(200,215,228,.48);margin-top:5px}
</style>
</head>

</div>

<div id="zoom">

</div>

  <div class="panel">

<div id="stats">

  </div>
</div>

<div id="ticker">
  <div class="tlbl">Live Feed</div>
  <div id="ticker-stage"></div>
</div>

<!-- SINGLE CITY MODAL -->
<div id="mov">
  <div id="modal">
    <div class="mstripe" id="mstripe"></div>
    <div class="mhead">
      <div class="mhl">
        <div class="mcity" id="mcity">—</div>
        <div class="mctry" id="mctry">—</div>
      </div>

      <div class="mmetrics-cards" id="mmetrics-cards"></div>

      </div>

    </div>
    <div class="mfoot">
      <div class="mfts" id="mfts">—</div>
      <button class="madd-cmp" id="madd-btn" onclick="addCurrentToCmp()">⇄ Karşılaştırmaya Ekle</button>
    </div>
  </div>
</div>

<!-- COMPARE MODAL -->
<div id="cmpov">

</div>

  if (!d) return null;
  return { ...r, norm: d.norm, metrics: d, score: d.norm };
}).filter(Boolean);

// Color by normalized score (0–1)
function sc(n){
  return n >= 0.6 ? '#7AAC6C' : n >= 0.35 ? '#4D9AC0' : '#C0616E';
}
function scoreLabel(n){
  const pct = Math.round(n * 100);
  return pct;
}
function zt(n){
  return n>=0.6?{cls:'pos',txt:'Pozitif Bölge'}:n>=0.35?{cls:'neu',txt:'Nötr Bölge'}:{cls:'neg',txt:'Stres Bölgesi'};
}

// ── RADAR helper ─────────────────────────────────────────────────────────────
function drawRadar(canvas, cityList, isDark){
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height; ctx.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2, R=Math.min(W,H)/2-28;
  const n=METRICS.length;
  const angles=METRICS.map((_,i)=>(-Math.PI/2)+(2*Math.PI*i/n));
  const gridCol = isDark ? 'rgba(200,215,228,0.12)' : 'rgba(41,87,115,0.12)';
  const lblCol  = isDark ? 'rgba(200,215,228,0.45)' : 'rgba(41,87,115,0.55)';

  [.25,.5,.75,1].forEach(r=>{
    ctx.beginPath();
    angles.forEach((a,i)=>{ const px=cx+Math.cos(a)*R*r, py=cy+Math.sin(a)*R*r; i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); });
    ctx.closePath(); ctx.strokeStyle=gridCol; ctx.lineWidth=1; ctx.stroke();
  });
  angles.forEach(a=>{
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);
    ctx.strokeStyle=gridCol; ctx.lineWidth=1; ctx.stroke();
  });
  ctx.font='600 8px "DM Mono",monospace'; ctx.fillStyle=lblCol; ctx.textAlign='center'; ctx.textBaseline='middle';
  METRICS.forEach((d,i)=>{ const a=angles[i]; ctx.fillText(d.short.toUpperCase(),cx+Math.cos(a)*(R+18),cy+Math.sin(a)*(R+18)); });

  cityList.forEach((city,ci)=>{
    const hex=SCOL[ci];
    const vals=METRICS.map(d=>city.metrics[d.k]||0);
    ctx.beginPath();
    vals.forEach((v,i)=>{ const px=cx+Math.cos(angles[i])*R*v, py=cy+Math.sin(angles[i])*R*v; i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); });
    ctx.closePath(); ctx.fillStyle=hex+'28'; ctx.fill(); ctx.strokeStyle=hex; ctx.lineWidth=2; ctx.stroke();
    vals.forEach((v,i)=>{
      const px=cx+Math.cos(angles[i])*R*v, py=cy+Math.sin(angles[i])*R*v;
      ctx.beginPath(); ctx.arc(px,py,3.5,0,Math.PI*2); ctx.fillStyle=hex; ctx.fill();
    });
  });
}

// ── SCATTER helper ─────────────────────────────────────────────────────────────
function drawScatter(canvas, curCity){
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height; ctx.clearRect(0,0,W,H);
  const PAD={l:36,r:16,t:10,b:28};
  const pw=W-PAD.l-PAD.r, ph=H-PAD.t-PAD.b;

  // find fac1/fac2 ranges
  const f1s=cities.map(c=>c.metrics.fac1), f2s=cities.map(c=>c.metrics.fac2);
  const f1min=Math.min(...f1s)-0.2, f1max=Math.max(...f1s)+0.2;
  const f2min=Math.min(...f2s)-0.2, f2max=Math.max(...f2s)+0.2;

  const tx=v=>PAD.l+(v-f1min)/(f1max-f1min)*pw;
  const ty=v=>PAD.t+ph-(v-f2min)/(f2max-f2min)*ph;

  // grid
  ctx.strokeStyle='rgba(200,215,228,0.08)'; ctx.lineWidth=1;
  [-.5,0,.5,1,1.5,2].forEach(v=>{
    if(v>=f1min&&v<=f1max){ ctx.beginPath(); ctx.moveTo(tx(v),PAD.t); ctx.lineTo(tx(v),PAD.t+ph); ctx.stroke(); }
    if(v>=f2min&&v<=f2max){ ctx.beginPath(); ctx.moveTo(PAD.l,ty(v)); ctx.lineTo(PAD.l+pw,ty(v)); ctx.stroke(); }
  });

  // axes labels
  ctx.font='8px "DM Mono",monospace'; ctx.fillStyle='rgba(200,215,228,0.3)'; ctx.textAlign='center';
  ctx.fillText('FAC1 →',PAD.l+pw/2,H-4);
  ctx.save(); ctx.translate(10,PAD.t+ph/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('FAC2 →',0,0); ctx.restore();

  // all cities as tiny dots
  cities.forEach(c=>{
    const hex=sc(c.norm);
    ctx.beginPath(); ctx.arc(tx(c.metrics.fac1),ty(c.metrics.fac2),3,0,Math.PI*2);
    ctx.fillStyle=hex+'55'; ctx.fill();
  });

  // current city highlighted
  if(curCity){
    const hex=sc(curCity.norm);
    const x=tx(curCity.metrics.fac1), y=ty(curCity.metrics.fac2);
    // ring
    ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2);
    ctx.strokeStyle=hex+'44'; ctx.lineWidth=1.5; ctx.stroke();
    // dot
    ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2);
    ctx.fillStyle=hex; ctx.fill();
    // label
    ctx.font='bold 9px "DM Mono",monospace'; ctx.fillStyle='rgba(200,215,228,0.9)'; ctx.textAlign='left';
    ctx.fillText(curCity.city,x+8,y+3);
  }
}

function drawScatterCmp(canvas, cityList){
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height; ctx.clearRect(0,0,W,H);
  const PAD={l:36,r:16,t:14,b:28};

  const f2min=Math.min(...f2s)-0.2, f2max=Math.max(...f2s)+0.2;
  const tx=v=>PAD.l+(v-f1min)/(f1max-f1min)*pw;
  const ty=v=>PAD.t+ph-(v-f2min)/(f2max-f2min)*ph;

  ctx.strokeStyle='rgba(200,215,228,0.07)'; ctx.lineWidth=1;
  [-.5,0,.5,1,1.5,2].forEach(v=>{
    if(v>=f1min&&v<=f1max){ ctx.beginPath(); ctx.moveTo(tx(v),PAD.t); ctx.lineTo(tx(v),PAD.t+ph); ctx.stroke(); }
    if(v>=f2min&&v<=f2max){ ctx.beginPath(); ctx.moveTo(PAD.l,ty(v)); ctx.lineTo(PAD.l+pw,ty(v)); ctx.stroke(); }
  });
  ctx.font='8px "DM Mono",monospace'; ctx.fillStyle='rgba(200,215,228,0.28)'; ctx.textAlign='center';
  ctx.fillText('FAC1 →',PAD.l+pw/2,H-4);
  ctx.save(); ctx.translate(10,PAD.t+ph/2); ctx.rotate(-Math.PI/2); ctx.fillText('FAC2',0,0); ctx.restore();

  cities.forEach(c=>{
    const hex=sc(c.norm);
    ctx.beginPath(); ctx.arc(tx(c.metrics.fac1),ty(c.metrics.fac2),2.5,0,Math.PI*2);
    ctx.fillStyle=hex+'40'; ctx.fill();
  });
  cityList.forEach((c,ci)=>{
    const hex=SCOL[ci]; const x=tx(c.metrics.fac1), y=ty(c.metrics.fac2);
    ctx.beginPath(); ctx.arc(x,y,11,0,Math.PI*2);
    ctx.strokeStyle=hex+'55'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y,5.5,0,Math.PI*2);
    ctx.fillStyle=hex; ctx.fill();
    ctx.font='bold 9px "DM Mono",monospace'; ctx.fillStyle=hex; ctx.textAlign='left';
    ctx.fillText(c.city,x+10,y+3);
  });
}

// ── TICKER ────────────────────────────────────────────────────────────────────
(()=>{
  const stage=document.getElementById('ticker-stage');
  const sh=[...cities].sort(()=>Math.random()-.5);
  const grps=[]; for(let i=0;i<sh.length;i+=4) grps.push(sh.slice(i,i+4));
  grps.forEach(grp=>{
    const card=document.createElement('div'); card.className='tick-card';
    card.innerHTML=grp.map(c=>{const hex=sc(c.norm);
      return`<div class="tick-item"><div class="tick-dot" style="background:${hex}"></div>
<span class="tick-city">${c.city}</span>
<span class="tick-score" style="color:${hex}">${fmt(c.norm)}</span></div>`;
    }).join('');
    stage.appendChild(card);
  });
  const cards=stage.querySelectorAll('.tick-card'); let cur=0;
  function show(i){cards.forEach((c,j)=>{c.classList.remove('active','leaving');if(j===i)c.classList.add('active');});}
  function next(){const p=cur;cur=(cur+1)%cards.length;cards[p].classList.add('leaving');setTimeout(()=>cards[p].classList.remove('leaving'),600);show(cur);}
  show(0); setInterval(next,3000);
})();

// ── SEARCH ────────────────────────────────────────────────────────────────────
const si=document.getElementById('sinput'), sr=document.getElementById('sresults');
si.addEventListener('input',()=>{
  const q=si.value.toLowerCase().trim();
  if(!q){sr.style.display='none';return;}
  const hits=cities.filter(c=>c.city.toLowerCase().includes(q)||c.country.toLowerCase().includes(q)).slice(0,6);
  if(!hits.length){sr.style.display='none';return;}
  sr.style.display='block';
  sr.innerHTML=hits.map(c=>{const hex=sc(c.norm);
    return`<div class="sri" onclick="flyTo(${c.lat},${c.lng})">
<div><div class="sri-city">${c.city}</div><div class="sri-ctry">${c.country}</div></div>
<div class="sri-sc" style="color:${hex}">${fmt(c.norm)}</div></div>`;
  }).join('');
});
document.addEventListener('click',e=>{if(!document.getElementById('searchbar').contains(e.target))sr.style.display='none';});
function flyTo(lat,lng){map.flyTo([lat,lng],6,{duration:1.2,easeLinearity:.25});sr.style.display='none';si.value='';}
document.getElementById('zi').onclick=()=>map.zoomIn();
document.getElementById('zo').onclick=()=>map.zoomOut();

renderSlots();
